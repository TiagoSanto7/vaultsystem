<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Fontes ligadas ao núcleo do Vault System">
  <!-- Grafo orbital: anéis claros, nós brancos com contorno azul e rótulo mono, ligações em link, núcleo azul com centro branco e halo. -->
  <defs>
    <radialGradient id="halo"><stop offset="0" stop-color="#0758ed" stop-opacity=".28"/><stop offset="1" stop-color="#0758ed" stop-opacity="0"/></radialGradient>
  </defs>
  <g fill="none" stroke="#cedeff" stroke-width="2">
    <circle cx="400" cy="400" r="150"/><circle cx="400" cy="400" r="250"/><circle cx="400" cy="400" r="350"/>
  </g>
  <g stroke="#9cbaff" stroke-width="3">
    <line x1="400" y1="400" x2="155" y2="190"/><line x1="400" y1="400" x2="660" y2="230"/>
    <line x1="400" y1="400" x2="150" y2="590"/><line x1="400" y1="400" x2="640" y2="610"/>
    <line x1="400" y1="400" x2="400" y2="60"/>
  </g>
  <circle cx="400" cy="400" r="150" fill="url(#halo)"/>
  <circle cx="400" cy="400" r="58" fill="#0758ed"/><circle cx="400" cy="400" r="20" fill="#fff"/>
  <g fill="#fff" stroke="#0758ed" stroke-width="4">
    <circle cx="155" cy="190" r="22"/><circle cx="660" cy="230" r="22"/>
    <circle cx="150" cy="590" r="22"/><circle cx="640" cy="610" r="22"/><circle cx="400" cy="60" r="22"/>
  </g>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="24" fill="#485b7b" text-anchor="middle">
    <text x="155" y="148">código</text><text x="660" y="188">docs</text>
    <text x="150" y="642">decisões</text><text x="640" y="662">agentes</text><text x="400" y="22">cli</text>
  </g>
</svg>
