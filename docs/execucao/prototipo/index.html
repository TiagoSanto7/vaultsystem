function home(){return `<div class="heading"><div><div class="eyebrow">SEU CONHECIMENTO, CONECTADO</div><h1>Olá, Tiago<span class="green">.</span></h1><p>Uma visão clara do que seus sistemas sabem.</p></div><span class="muted" style="font-size:11px">Workspace Petrovina</span></div><section class="hero"><div class="hero-copy"><h2>Do código ao conhecimento.</h2><p>Encontre respostas confiáveis, acompanhe suas fontes e mantenha o contexto dos seus sistemas vivo.</p>${btn('Explorar sistemas','nav:systems','arrow',true)}</div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="orbit two"></div><div class="vault">${icon('book')}</div><div class="floating a">${icon('git')}Fontes conectadas</div><div class="floating b">${icon('shield')}Conhecimento verificado</div></div></section><div class="metrics">${metric('Sistemas',String(systems.length).padStart(2,'0'),'Cadastrados no workspace','grid')}${metric('Notas de conhecimento','124','Curadas em Markdown','book')}${metric('Repositórios GitHub',systems.reduce((n,s)=>n+s.repos,0),'Distribuídos entre os sistemas','git')}${metric('Notas verificadas',Math.round((117+state.verified)/124*100)+'%',(117+state.verified)+' de 124 notas','shield')}</div><div class="columns"><section class="panel"><div class="panel-head"><h2>Seus sistemas</h2><button class="textbtn" data-action="nav:systems">Ver todos ${icon('arrow')}</button></div>${systems.map((s,i)=>`<button class="system-row" data-action="system:${i}"><span class="sysicon">${icon(s.ico)}</span><div><h3>${s.name}</h3><small>${s.repos} repositórios <span style="padding:0 5px">·</span> ${s.notes} notas</small></div>${badge(s.status)}${icon('chevron')}</button>`).join('')}</section><section class="panel"><div class="panel-head"><h2>Atividade recente</h2><span class="badge neutral">Hoje</span></div>${[['shield','Conhecimento verificado','Petro Observer · 12 notas revisadas','Há 18 minutos'],['git','Fontes sincronizadas','Petro Core · 3 repositórios','Há 42 minutos'],['spark','Novas notas para revisão','Petro Logistics · 7 notas geradas','Há 1 hora']].map(a=>`<div class="activity"><div class="activity-icon">${icon(a[0])}</div><div><p>${a[1]}</p><small>${a[2]}</small><small>${a[3]}</small></div></div>`).join('')}</section></div>`}
function systemList(){return `<div class="heading"><div><div class="eyebrow">CATÁLOGO DO WORKSPACE</div><h1>Sistemas</h1><p>O contexto de cada sistema, em um só lugar.</p></div>${btn('Cadastrar sistema','new-system','plus',true)}</div><div class="toolbar"><div class="search">${icon('search')}<input id="search" placeholder="Buscar sistema..." aria-label="Buscar sistema" value="${escapeHTML(state.query)}"></div><select id="filter" aria-label="Filtrar sistemas"><option>Todos</option><option ${state.filter==='Atualizado'?'selected':''}>Atualizado</option><option ${state.filter==='Em revisão'?'selected':''}>Em revisão</option>${['Sem fontes','Pendente','Fluxo simulado'].map(t=>`<option ${state.filter===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="cards" id="results">${systemCards()}</div>`}
function systemCards(){let visible=systems.map((s,i)=>({...s,i})).filter(s=>s.name.toLowerCase().includes(state.query.toLowerCase())&&(state.filter==='Todos'||state.filter===s.status));return visible.map(s=>`<button class="system-card" data-action="system:${s.i}"><div class="card-top"><span class="sysicon">${icon(s.ico)}</span>${badge(s.status)}</div><h2>${s.name}</h2><p>${s.desc}</p><div class="tags">${s.tags.split(' · ').map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="card-bottom"><span>${s.repos} repositórios · ${s.notes} notas</span>${icon('arrow')}</div></button>`).join('')||'<div class="empty">Nenhum sistema encontrado. Tente outro nome ou filtro.</div>'}
function detail(){let s=systems[state.system];return `<button class="back" data-action="nav:systems">${icon('back')}Todos os sistemas</button><div class="heading"><div class="system-title"><span class="sysicon">${icon(s.ico)}</span><div><h1>${s.name}</h1><p>${s.desc}</p></div></div>${badge(s.status)}</div><div class="tabs" role="tablist" aria-label="Seções do sistema">${['Visão geral','Conhecimento','Mapa','Fontes','Processamento','Agente','Integrações'].map(t=>`<button role="tab" aria-selected="${state.tab===t}" class="tab ${state.tab===t?'active':''}" data-action="tab:${t}">${t}</button>`).join('')}</div><div class="page" role="tabpanel">${state.tab==='Acessos'?access():state.tab==='Integrações'?integrations():state.tab==='Mapa'?knowledgeMap():state.tab==='Agente'?agentPage():state.system!==0?otherSystem(s):state.tab==='Visão geral'?overview():state.tab==='Conhecimento'?knowledge():state.tab==='Fontes'?sources():state.tab==='Processamento'?processing():access()}</div>`}
function otherSystem(s){return `<div class="banner">${icon('help')}Prévia do catálogo. O fluxo detalhado desta revisão está no Petro Observer.</div><div class="metrics">${metric('Repositórios',s.repos,'Fontes de exemplo','git')}${metric('Notas',s.notes,'Conteúdo ilustrativo','book')}</div><section class="panel"><div class="panel-head"><h2>${state.tab}</h2></div><div class="overview-copy">Explore o Petro Observer para experimentar as cinco abas e os fluxos de curadoria, fontes e acessos.<div style="margin-top:20px">${btn('Explorar Petro Observer','system:0','arrow',true)}</div></div></section>`}
function overview(){return `<div class="metrics">${metric('Notas de conhecimento','48','Organizadas por contexto','book')}${metric('Fontes cadastradas',systems[0].repos,'Repositórios GitHub','git')}${metric('Cobertura verificada',Math.round((46+state.verified)/48*100)+'%',(46+state.verified)+' de 48 notas','shield')}${metric('Última sincronização',state.done?'Agora':'09:42',state.done?'Simulação concluída':'Hoje · execução de exemplo','refresh')}</div><div class="columns"><div><section class="panel"><div class="panel-head"><h2>Contexto do sistema</h2><span class="badge neutral">Visão consolidada</span></div><div class="overview-copy">O Petro Observer transforma sinais da operação em informação acionável. Aqui, arquitetura, integrações e regras de negócio ganham contexto a partir de múltiplos repositórios.<div class="tags"><span class="tag">Observabilidade</span><span class="tag">Operação</span><span class="tag">API + Web + Workers</span></div></div></section><section class="panel section-gap"><div class="panel-head"><h2>Como o conhecimento chega aqui</h2></div><div class="pipeline">${[['git','Repositórios'],['spark','Curadoria IA'],['file','Notas Markdown'],['shield','Verificação']].map((a,i)=>`${i?'<i></i>':''}<div class="stage"><span>${icon(a[0])}</span>${a[1]}</div>`).join('')}</div></section></div><section class="panel"><div class="panel-head"><h2>Qualidade do conhecimento</h2>${icon('shield')}</div><div class="health"><span class="big">${46+state.verified}<span class="muted" style="font-size:17px"> / 48</span></span><p class="muted" style="font-size:12px">notas verificadas</p><div class="bar"><i style="width:${(46+state.verified)/48*100}%"></i></div><ul><li><span>Proveniência registrada</span><b>48 notas</b></li><li><span>Aguardando revisão</span><b class="amber">${2-state.verified} ${state.verified===1?'nota':'notas'}</b></li></ul><button class="textbtn" data-action="tab:Conhecimento" style="margin-top:18px">Explorar conhecimento ${icon('arrow')}</button></div></section></div><section class="panel section-gap"><div class="panel-head"><h2>Continue de onde parou</h2><span class="muted" style="font-size:11px">Nota recente</span></div><button class="system-row" data-action="note:0"><span class="sysicon">${icon('file')}</span><div><h3>Arquitetura do Petro Observer</h3><small>Arquitetura · observer-api · docs/architecture.md</small></div>${badge('Verificada')}${icon('chevron')}</button></section>`}
function knowledge(){return `<div class="heading"><div><h2>Conhecimento com contexto</h2></div><span class="badge neutral">4 de 48 notas nesta amostra</span></div><div class="toolbar"><div class="search">${icon('search')}<input id="search" aria-label="Buscar notas" placeholder="Buscar nota ou assunto..." value="${escapeHTML(state.query)}"></div><select id="filter" aria-label="Filtrar notas"><option>Todos</option><option ${state.filter==='Verificada'?'selected':''}>Verificada</option><option ${state.filter==='Em revisão'?'selected':''}>Em revisão</option></select></div><section class="panel table-wrap"><table><thead><tr><th>NOTA</th><th>ESTADO</th><th>ATUALIZAÇÃO</th><th></th></tr></thead><tbody id="results">${noteRows()}</tbody></table></section>`}
function noteRows(){return notes.map((n,i)=>({...n,i})).filter(n=>(n.title+' '+n.type).toLowerCase().includes(state.query.toLowerCase())&&(state.filter==='Todos'||state.filter===n.status)).map(n=>`<tr><td><button class="textbtn note-title" data-action="note:${n.i}">${icon('file')}<span>${n.title}<small>${n.type} · ${n.repo}</small></span></button></td><td>${badge(n.status)}</td><td class="muted">${n.date}</td><td><button class="icon-btn" aria-label="Abrir ${n.title}" data-action="note:${n.i}">${icon('chevron')}</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhuma nota encontrada. Tente outro termo ou filtro.</td></tr>'}
function sources(){return `<div class="heading"><div><h2>Fontes do sistema</h2><p>Três repositórios, uma visão consolidada do Petro Observer.</p></div>${btn('Simular sincronização','sync','refresh')}</div><div class="banner">${icon('shield')}Credencial associada à tag <b>petro-observer</b>. Nenhum segredo é exibido neste protótipo.</div><section class="panel"><div class="panel-head"><h2>Repositórios GitHub</h2><span class="badge neutral">3 fontes ilustrativas</span></div>${[['observer-api','API e regras de negócio','24 notas'],['observer-web','Interface e autenticação','14 notas'],['observer-workers','Ingestão e processamento','10 notas']].map((r,i)=>`<div class="repo"><span class="sysicon">${icon('git')}</span><div class="repo-info"><h3>petrovina / ${r[0]}</h3><small>${r[1]} · branch main · ${r[2]}</small></div>${badge('Sincronizado')}<button class="btn" data-action="repo:${i}">Ver origem ${icon('arrow')}</button></div>`).join('')}</section><p class="muted" style="font-size:11px;margin-top:15px">Nomes de repositórios e referências são fictícios. Nenhuma conexão externa é realizada.</p>`}
function processing(){return `<div class="heading"><div><h2>Processamento</h2></div><button class="btn primary" data-action="sync" ${state.running?'disabled':''}>${icon('play')}${state.running?'Simulando...':'Simular processamento'}</button></div><section class="panel"><div class="panel-head"><h2>${state.running?'Execução em andamento':state.done?'Simulação concluída':'Última execução'}</h2>${badge(state.running?'Em andamento':'Concluída')}</div><div class="pipeline">${[['git','Coleta'],['file','Análise'],['spark','Curadoria'],['shield','Validação']].map((a,i)=>`${i?'<i></i>':''}<div class="stage ${state.running&&state.progress/25>=i&&state.progress/25<i+1?'pulse':''}"><span>${icon((state.running&&state.progress<(i+1)*25)?a[0]:'check')}</span>${a[1]}</div>`).join('')}</div><div class="run"><div class="run-info"><h3>${state.running?['Lendo fontes de exemplo','Analisando arquivos','Organizando notas Markdown','Verificando proveniência'][Math.min(3,Math.floor(state.progress/25))]:state.done?'Fluxo demonstrativo finalizado':'3 fontes processadas com sucesso'}</h3><small>${state.running?'Simulação local · nenhum repositório será acessado':state.done?'A simulação percorreu as quatro etapas. Os dados de exemplo foram preservados.':'Hoje, 09:42 · 48 notas indexadas · execução ilustrativa'}</small></div><div class="run-progress"><small>${state.running?state.progress:100}% concluído</small><div class="bar"><i style="width:${state.running?state.progress:100}%"></i></div></div></div></section><section class="panel section-gap"><div class="panel-head"><h2>Histórico ilustrativo</h2></div><div class="table-wrap"><table><thead><tr><th>EXECUÇÃO</th><th>ORIGEM</th><th>RESULTADO</th><th>DURAÇÃO</th></tr></thead><tbody><tr><td>Hoje, 09:42</td><td>Sincronização programada</td><td>${badge('Concluída')}</td><td>2 min 18 s</td></tr><tr><td>Ontem, 16:20</td><td>Atualização de fontes</td><td>${badge('Concluída')}</td><td>1 min 46 s</td></tr></tbody></table></div></section>`}
function access(){return `<div class="heading"><div><h2>Acessos e credenciais</h2><p>Identidade corporativa para pessoas. Credenciais por tag para fontes.</p></div></div><div class="columns"><section class="panel"><div class="panel-head"><h2>Grupos do diretório AD</h2>${icon('users')}</div><div class="table-wrap"><table><thead><tr><th>GRUPO ILUSTRATIVO</th><th>PERFIL</th></tr></thead><tbody><tr><td>PV-Observer-Admins<small>Configuração e gestão de fontes</small></td><td>${badge('Administrador')}</td></tr><tr><td>PV-Observer-Curadores<small>Revisão e verificação das notas</small></td><td>${badge('Curador')}</td></tr><tr><td>PV-Observer-Leitores<small>Consulta ao conhecimento publicado</small></td><td><span class="badge neutral">Leitor</span></td></tr></tbody></table></div></section><section class="panel"><div class="panel-head"><h2>Credencial por tag</h2>${icon('lock')}</div><div class="overview-copy"><span class="tag">petro-observer</span><p style="margin:18px 0">A tag associa os três repositórios à credencial de leitura do sistema.</p><div class="switchrow"><span>Escopo</span><b>Leitura de conteúdo</b></div><div class="switchrow"><span>Segredo</span><span>••••••••••••</span></div>${btn('Ver política de acesso','policy','shield')}</div></section></div><div class="banner section-gap">${icon('help')}Representação visual de AD e credenciais. Não há autenticação real nem armazenamento de segredos.</div>`}
function escapeHTML(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let lastFocus;function modal(html){lastFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="Detalhes"><div class="modal-header"><div class="eyebrow" style="margin:9px 0">PETROVAULT / DEMONSTRAÇÃO</div><button class="icon-btn" data-action="close" aria-label="Fechar">${icon('close')}</button></div>${html}</section></div>`;document.querySelector('.modal button').focus()}
function closeModal(){document.getElementById('overlay').innerHTML='';lastFocus?.focus()}
function note(i){let n=notes[i];modal(`<h2>${n.title}</h2><div class="tags">${badge(n.status)}<span class="tag">${n.type}</span><span class="tag">Markdown</span></div><h3>Visão consolidada</h3><p>${n.desc}</p><h3>Como este conhecimento foi produzido</h3><p>Nota ilustrativa de curadoria por IA a partir dos arquivos do sistema. A verificação humana confirma o conteúdo e mantém o vínculo com a versão consultada.</p><div class="source"><b>Proveniência</b><p style="margin-bottom:6px">petrovina/${n.repo}<br>${n.file}<br>Commit: <code>8f3a2c1</code> · branch main</p><small>Referência fictícia para demonstrar rastreabilidade.</small></div><div class="modal-actions">${btn('Ver fontes','note-sources','git')}${n.status==='Em revisão'?btn('Simular verificação',`verify:${i}`,'check',true):btn('Fechar','close')}</div>`)}
function toast(s){document.getElementById('toasts').innerHTML=`<div class="toast" role="status">${s}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toasts').innerHTML='',4000)}
function theme(){state.dark=!state.dark;try{localStorage.setItem('pv-theme',state.dark?'dark':'light')}catch(e){}render()}

function sync(){if(state.running){toast('Já existe uma simulação em andamento.');return}state.running=true;state.progress=0;state.tab='Processamento';state.page='detail';render();let timer=setInterval(()=>{state.progress+=10;if(state.progress>=100){clearInterval(timer);state.running=false;state.done=true;toast('Simulação concluída. Nenhum repositório foi acessado.')}if(state.page==='detail'&&state.tab==='Processamento')render()},550)}
document.addEventListener('click',e=>{let a=e.target.closest('[data-action]')?.dataset.action;if(!a){if(e.target.classList.contains('modal-backdrop'))closeModal();if(state.profile&&!e.target.closest('.profilewrap')){state.profile=false;render()}return}let [type,arg]=a.split(':');if(type==='nav')nav(arg);else if(type==='system')openSystem(+arg);else if(type==='tab'){state.tab=arg;state.query='';state.filter='Todos';render()}else if(type==='theme')theme();else if(type==='collapse'){state.collapsed=!state.collapsed;render()}else if(type==='profile'){state.profile=!state.profile;render()}else if(type==='close')closeModal();else if(type==='note')note(+arg);else if(type==='verify'){if(notes[+arg].status!=='Verificada')state.verified++;notes[+arg].status='Verificada';closeModal();render();toast('Verificação simulada nesta sessão.')}else if(type==='note-sources'){closeModal();state.tab='Fontes';render()}else if(type==='sync')sync();else if(type==='help')modal(`<h2>Conheça o PetroVault.</h2><p>Um protótipo para revisar a experiência de conhecimento corporativo.</p><h3>Experimente</h3><p>Cadastre um sistema e suas fontes. No Petro Observer, explore o Mapa, abra notas e converse com o Agente. As respostas do agente são roteirizadas e citam as notas da amostra. Alterne o tema e recolha o menu para explorar o espaço.</p><div class="source">Todos os números, fontes, grupos e atividades são ilustrativos. GitHub, IA e AD não estão conectados.</div><h3>Próxima etapa</h3><p>Um onboarding curto de primeiro login será desenhado após a revisão desta experiência.</p>${btn('Explorar','close','arrow',true)}`);else if(type==='account'){state.profile=false;render();modal('<h2>Tiago Santo</h2><p>Perfil ilustrativo do workspace Petrovina.</p><div class="source"><b>Identidade</b><p>Diretório corporativo AD · sessão de demonstração</p><b>Perfil no Petro Observer</b><p>Administrador</p></div>')}else if(type==='preferences'){state.profile=false;render();modal(`<h2>Preferências</h2><p>A aparência fica salva neste navegador.</p><div class="switchrow"><span>Tema atual: ${state.dark?'escuro':'claro'}</span>${btn('Alternar tema','pref-theme','sun')}</div><div class="source">Animações respeitam a preferência de movimento reduzido do seu dispositivo.</div>`)}else if(type==='pref-theme'){theme();closeModal();toast('Tema atualizado.')}else if(type==='logout'){state.signedout=true;state.profile=false;render()}else if(type==='login'){state.signedout=false;nav('home');toast('Bem-vindo à demonstração. Login AD não conectado.')}else if(type==='policy')modal('<h2>Acesso com contexto.</h2><p>Modelo ilustrativo de autorização para o Petro Observer.</p><h3>Pessoas</h3><p>Grupos AD determinam quem administra, revisa ou consulta o conhecimento do sistema.</p><h3>Fontes</h3><p>A tag petro-observer seleciona a credencial de leitura usada na ingestão dos repositórios. O segredo não aparece na interface.</p><div class="source">Nenhuma credencial real é solicitada ou armazenada nesta demonstração.</div>');else if(type==='repo'){let r=['observer-api','observer-web','observer-workers'][+arg];modal(`<h2>${r}</h2><p>Fonte ilustrativa do Petro Observer.</p><div class="source"><b>Referência de origem</b><p>petrovina/${r}<br>Branch: main<br>Commit: 8f3a2c1<br>Credencial: tag petro-observer</p><small>Dados fictícios. Não é um link para um repositório real.</small></div><div class="modal-actions">${btn('Fechar','close')}</div>`)}});

function sources(){let list=sourceSets[state.system]||[];return `<div class="heading"><div><h2>Fontes do sistema</h2><p>Vários repositórios. Um contexto compartilhado.</p></div><div class="actions">${btn('Adicionar fonte','add-source','plus',true)}${list.length?btn('Simular sincronização','sync','refresh'):''}</div></div><div class="banner">${icon('lock')}Cada fonte seleciona uma credencial de acesso ao GitHub, separada das tags de organização. Cadastros ficam apenas nesta sessão; nenhum GitHub é acessado.</div><section class="panel"><div class="panel-head"><h2>Repositórios GitHub</h2><span class="badge neutral">${list.length} fontes</span></div>${list.length?list.map((r,i)=>`<div class="repo"><span class="sysicon">${icon('git')}</span><div class="repo-info"><h3>${r.name}</h3><small>Branch ${r.branch} · ${credentialName(r.credential)} · ${r.count} notas</small></div>${badge(r.status)}${btn('Detalhes',`source-detail:${i}`,'arrow')}</div>`).join(''):`<div class="empty"><div class="empty-icon">${icon('git')}</div><h2>Conecte o primeiro repositório.</h2><p>Informe uma fonte para começar a construir o contexto deste sistema.</p>${btn('Adicionar primeira fonte','add-source','plus',true)}</div>`}</section><p class="muted" style="font-size:11px;margin-top:16px">Recarregar a página restaura os dados de exemplo. Não informe tokens ou senhas.</p>`}
function systemForm(){modal(`<div class="eyebrow">PASSO 1 / ORGANIZE O CONTEXTO</div><h2>Um novo sistema, um novo contexto.</h2><p>Cadastre o sistema. Depois, adicione seus repositórios na aba Fontes.</p><form id="system-form"><label for="sys-name">Nome do sistema *</label><input id="sys-name" name="name" maxlength="60" required placeholder="Ex.: Petro Maintenance"><label for="sys-desc">Descrição *</label><textarea id="sys-desc" name="desc" maxlength="240" required placeholder="O que este sistema faz e para quem?"></textarea><div class="form-grid"><div><label for="sys-team">Equipe responsável *</label><input id="sys-team" name="team" maxlength="60" required placeholder="Ex.: Engenharia de operações"></div><div><label for="sys-tags">Tags de contexto</label><input id="sys-tags" name="tags" maxlength="100" placeholder="Manutenção, Operação"></div></div><p class="form-error" role="alert" id="form-error"></p><div class="source">Cadastro demonstrativo, mantido apenas nesta sessão. Fontes e permissões são etapas separadas.</div><div class="modal-actions"><button type="button" class="btn" data-action="close">Cancelar</button><button class="btn primary" type="submit">Criar sistema ${icon('arrow')}</button></div></form>`);document.getElementById('sys-name').focus()}
function sourceForm(){modal(`<div class="eyebrow">PASSO 2 / ADICIONE UMA ORIGEM</div><h2>Adicionar fonte</h2><p>Vincule um repositório GitHub a <b>${systems[state.system].name}</b>. Você pode adicionar quantos precisar.</p><form id="source-form"><label for="src-url">URL do repositório *</label><input id="src-url" name="url" type="url" required placeholder="https://github.com/organizacao/repositorio"><small>Use a URL do repositório, sem tokens, caminhos de arquivos ou parâmetros.</small><div class="form-grid"><div><label for="src-branch">Branch *</label><input id="src-branch" name="branch" required maxlength="80" value="main"></div><div><label for="src-credential">Credencial de acesso à fonte *</label><select id="src-credential" name="credential" required style="width:100%"><option value="">Selecione uma opção</option><option value="github-engineering">GitHub — Engenharia</option><option value="github-docs">GitHub — Documentação</option><option value="public">Repositório público (sem credencial)</option></select></div></div><small>Seleção demonstrativa de uma credencial previamente provisionada. Não informe tokens aqui. A existência, a visibilidade e a permissão do repositório não são verificadas pelo mockup.</small><p class="form-error" role="alert" id="form-error"></p><div class="source">Ao cadastrar, a fonte fica aguardando processamento. A simulação não autentica no GitHub nem gera conteúdo real.</div><div class="modal-actions"><button type="button" class="btn" data-action="close">Cancelar</button><button class="btn primary" type="submit">Adicionar fonte ${icon('plus')}</button></div></form>`);document.getElementById('src-url').focus()}
function sourceDetail(i){let r=sourceSets[state.system][i];modal(`<h2>${r.name}</h2><p>Origem cadastrada para ${systems[state.system].name}.</p><div class="source"><b>Branch</b><p>${r.branch}</p><b>Credencial de acesso à fonte</b><p>${credentialName(r.credential)}</p><b>Estado</b><p>${r.status} · ${r.count} notas</p></div><p>Referência demonstrativa. Nenhuma conexão ou validação de credencial foi realizada.</p><div class="modal-actions">${btn('Fechar','close')}</div>`)}
document.addEventListener('submit',e=>{if(!['system-form','source-form','chat-form'].includes(e.target.id))return;e.preventDefault();let form=e.target,data=new FormData(form);if(form.id==='chat-form'){sendChat(data.get('message'));return}let fail=s=>{document.getElementById('form-error').textContent=s};if(form.id==='system-form'){let raw=String(data.get('name')).trim(),desc=String(data.get('desc')).trim(),team=String(data.get('team')).trim();if(!raw||!desc||!team)return fail('Preencha nome, descrição e equipe responsável.');let name=escapeHTML(raw);if(systems.some(s=>s.name.toLowerCase()===name.toLowerCase()))return fail('Já existe um sistema com esse nome.');let tags=String(data.get('tags')).split(',').map(t=>t.trim()).filter(Boolean).slice(0,6);systems.push({name,desc:escapeHTML(desc),team:escapeHTML(team),tags:tags.map(escapeHTML).join(' · ')||'Novo sistema',repos:0,notes:0,status:'Sem fontes',ico:'grid',custom:true});sourceSets[systems.length-1]=[];closeModal();openSystem(systems.length-1,'Fontes');toast('Sistema criado nesta sessão. Adicione sua primeira fonte.')}else{let url;try{url=new URL(String(data.get('url')).trim())}catch{return fail('Informe uma URL válida do GitHub.')}if(url.protocol!=='https:'||url.hostname!=='github.com'||url.username||url.password||url.search||url.hash||url.port||!/^\/[\w.-]+\/[\w.-]+\/?$/.test(url.pathname))return fail('Use https://github.com/organizacao/repositorio, sem credenciais ou parâmetros.');let name=url.pathname.replace(/^\//,'').replace(/\/$/,'').replace(/\.git$/,'');let list=sourceSets[state.system]||(sourceSets[state.system]=[]);if(list.some(r=>r.name.toLowerCase()===name.toLowerCase()))return fail('Este repositório já está cadastrado neste sistema.');let branch=String(data.get('branch')).trim(),credential=String(data.get('credential')||'');if(!branch||!['github-engineering','github-docs','public'].includes(credential))return fail('Preencha a branch e selecione uma credencial de acesso à fonte.');list.push({name:escapeHTML(name),branch:escapeHTML(branch),credential,status:'Pendente',count:0});systems[state.system].repos=list.length;systems[state.system].status='Pendente';closeModal();state.tab='Fontes';render();toast('Fonte adicionada. Pronta para simular o processamento.')}});
const oldOther=otherSystem;otherSystem=function(s){if(state.tab==='Fontes')return sources();if(state.tab==='Mapa')return knowledgeMap();if(state.tab==='Agente')return agentPage();if(state.tab==='Processamento')return processing();if(!s.custom)return oldOther(s);if(state.tab==='Acessos')return `<div class="banner">${icon('lock')}Permissões ainda não configuradas para este sistema.</div><section class="panel"><div class="panel-head"><h2>Responsabilidade e identidade</h2></div><div class="overview-copy"><p>Equipe responsável: <b>${s.team}</b></p><p style="margin-top:12px">No produto, grupos do AD receberiam os perfis de administrador, curador e leitor. Nenhum acesso real é concedido por este cadastro demonstrativo.</p></div></section>`;if(state.tab==='Conhecimento')return `<section class="panel"><div class="empty"><div class="empty-icon">${icon('book')}</div><h2>Ainda não há notas.</h2><p>O cadastro de fontes prepara o contexto. Este protótipo não lê código nem produz notas reais.</p>${btn('Gerenciar fontes','tab:Fontes','git',true)}</div></section>`;return `<div class="metrics">${metric('Fontes',s.repos,'Repositórios cadastrados','git')}${metric('Conhecimento','0','Aguardando ingestão real','book')}</div><section class="panel"><div class="panel-head"><h2>Próximos passos</h2></div><div class="overview-copy"><p>${s.desc}</p><p style="margin:15px 0">Equipe responsável: ${s.team}</p><div class="actions">${btn('Adicionar fontes','add-source','plus',true)}${btn('Conversar com o agente','tab:Agente','spark')}</div></div></section>`};
const oldProcessing=processing;processing=function(){let list=sourceSets[state.system]||[];if(!list.length)return `<section class="panel"><div class="empty"><h2>Primeiro, cadastre uma fonte.</h2><p>O processamento precisa de pelo menos um repositório.</p>${btn('Adicionar fonte','add-source','plus',true)}</div></section>`;if(state.system===0)return oldProcessing();let r=runStates[state.system];return `<div class="heading"><div><h2>Processamento das fontes</h2><p>Simulação do fluxo de ingestão de ${list.length} repositórios.</p></div><button class="btn primary" data-action="sync" ${r?.running?'disabled':''}>${icon('play')}${r?.running?'Simulando...':'Simular processamento'}</button></div><section class="panel"><div class="panel-head"><h2>${r?.running?'Percorrendo as etapas':r?.done?'Simulação concluída':'Pronto para começar'}</h2></div><div class="overview-copy"><p>${r?.running?'Coleta → análise → curadoria → validação':r?.done?'O fluxo foi demonstrado. Nenhum código foi lido e nenhuma nota foi gerada.':'Execute uma prévia do fluxo sem acessar os repositórios.'}</p><div class="bar"><i style="width:${r?.progress||0}%"></i></div><small>${r?.progress||0}% · Dados de demonstração</small></div></section>`};
const runStates={};sync=function(){let id=state.system,list=sourceSets[id]||[];if(!list.length){toast('Adicione uma fonte antes de processar.');return}if(runStates[id]?.running)return;let run=runStates[id]={running:true,progress:0,done:false};state.tab='Processamento';if(id===0){state.running=true;state.progress=0}render();let timer=setInterval(()=>{run.progress+=10;if(id===0){state.progress=run.progress}if(run.progress>=100){clearInterval(timer);run.running=false;run.done=true;if(id===0){state.running=false;state.done=true}list.forEach(r=>{if(r.status==='Pendente')r.status='Fluxo simulado'});systems[id].status=list.some(r=>r.status==='Fluxo simulado')?'Fluxo simulado':systems[id].status;toast('Simulação concluída. Nenhuma fonte externa foi acessada.')}if(state.system===id&&state.page==='detail'&&state.tab==='Processamento')render()},450)};
function mapData(){let list=sourceSets[state.system]||[];let nodes=[{id:'system',label:systems[state.system].name,type:'Sistema',x:500,y:210}];list.forEach((r,i)=>nodes.push({id:'src'+i,label:r.name.split('/').pop(),type:'Fonte',x:180,y:list.length===1?210:65+i*300/Math.max(list.length-1,1),source:i}));if(state.system===0)notes.forEach((n,i)=>nodes.push({id:'note'+i,label:['Arquitetura','Ingestão de eventos','Política de alertas','Autenticação'][i],type:'Nota',x:810,y:45+i*103,note:i}));let links=list.map((r,i)=>({a:'src'+i,b:'system',label:'compõe'}));if(state.system===0)notes.forEach((n,i)=>{let source=list.findIndex(r=>r.name.endsWith('/'+n.repo));if(source>=0)links.push({a:'src'+source,b:'note'+i,label:'fundamenta'});links.push({a:'system',b:'note'+i,label:'documentado por'})});return {nodes,links}}
function knowledgeMap(){let d=mapData();return `<div class="heading"><div><div class="eyebrow">CONHECIMENTO EM RELAÇÃO</div><h2>Explore o contexto, siga a origem.</h2></div>${btn('Perguntar ao agente','tab:Agente','spark')}</div><section class="panel map-panel"><div class="map-toolbar"><div class="actions">${['Todos','Fontes','Notas'].map(t=>`<button class="map-chip ${graphFilter===t?'selected':''}" data-action="map-filter:${t}" aria-pressed="${graphFilter===t}">${t}</button>`).join('')}</div><div class="actions">${btn('−','zoom-out')}${btn('+','zoom-in')}${btn('Centralizar','map-reset')}</div></div><div id="map-canvas">${graphSvg(d)}</div><div class="map-hint">Arraste o fundo para mover · use +/− para ampliar · Tab e Enter para selecionar</div><div id="map-inspector">${graphInspector(d)}</div></section><p class="muted" style="font-size:11px;margin-top:13px">${state.system===0?'Amostra: 4 notas de 48. Relações ilustrativas, sem descoberta automática.':'Fontes cadastradas compõem o sistema. Relações com notas apareceriam após ingestão real.'}</p>`}
function graphSvg(d){let visible=d.nodes.filter(n=>n.type==='Sistema'||graphFilter==='Todos'||graphFilter==='Fontes'&&n.type==='Fonte'||graphFilter==='Notas'&&n.type==='Nota');let ids=new Set(visible.map(n=>n.id)),edges=d.links.filter(l=>ids.has(l.a)&&ids.has(l.b));let selected=ids.has(graphSelected)?graphSelected:'system';let connected=new Set([selected,...edges.filter(l=>l.a===selected||l.b===selected).flatMap(l=>[l.a,l.b])]);return `<svg id="knowledge-graph" viewBox="${graphView.x} ${graphView.y} ${graphView.w} ${graphView.h}" aria-label="Mapa de fontes, sistema e notas" style="touch-action:none"><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="var(--line)" stroke="none"/></pattern></defs><rect x="-5000" y="-5000" width="10000" height="10000" fill="url(#dots)" stroke="none"/>${edges.map(l=>{let a=d.nodes.find(n=>n.id===l.a),b=d.nodes.find(n=>n.id===l.b),active=l.a===selected||l.b===selected;return `<path class="map-edge ${active?'lit':''}" d="M${a.x} ${a.y} C${(a.x+b.x)/2} ${a.y},${(a.x+b.x)/2} ${b.y},${b.x} ${b.y}"><title>${a.label} ${l.label} ${b.label}</title></path>`}).join('')}${visible.map(n=>`<g class="map-node ${selected===n.id?'selected':''} ${connected.has(n.id)?'':'faded'}" role="button" tabindex="0" aria-label="${n.type}: ${n.label}" aria-pressed="${selected===n.id}" data-action="map-node:${n.id}" transform="translate(${n.x-90},${n.y-27})"><rect width="180" height="54" rx="12"/><circle cx="17" cy="18" r="3" class="node-dot ${n.type==='Fonte'?'source-dot':n.type==='Nota'?'note-dot':''}"/><text x="29" y="21" class="node-type">${n.type.toUpperCase()}</text><text x="14" y="41" class="node-name">${n.label.length>23?n.label.slice(0,21)+'…':n.label}</text></g>`).join('')}</svg>`}
function graphInspector(d){let n=d.nodes.find(n=>n.id===graphSelected)||d.nodes[0],edges=d.links.filter(l=>l.a===n.id||l.b===n.id);return `<div class="map-info"><div><span class="eyebrow">${n.type} ${n.type==='Sistema'?'SELECIONADO':'SELECIONADA'}</span><h2>${n.label}</h2>${n.type==='Nota'?badge(notes[n.note].status):''}<p>${n.type==='Nota'?notes[n.note].desc:n.type==='Fonte'?'Repositório que fornece contexto ao sistema. Consulte a branch, a credencial e o estado de ingestão.':'O sistema conecta seus repositórios e as notas de conhecimento produzidas a partir deles.'}</p><div class="tags">${edges.map(l=>{let other=d.nodes.find(o=>o.id===(l.a===n.id?l.b:l.a));return `<button class="tag" data-action="map-jump:${other.id}">${l.a===n.id?l.label:({'compõe':'composto por','fundamenta':'fundamentada por','documentado por':'documenta'}[l.label])} · ${other.label}</button>`}).join('')||'<span class="tag">Adicione fontes para formar as primeiras relações</span>'}</div></div><div class="actions">${n.type==='Nota'?btn('Abrir nota',`note:${n.note}`,'file',true):n.type==='Fonte'?btn('Ver fonte',`source-detail:${n.source}`,'git',true):btn('Adicionar fonte','add-source','plus')}${btn('Perguntar sobre isso',`map-ask:${n.id}`,'spark')}</div></div>`}

function sendChat(raw){let text=String(raw||'').trim(),id=state.system;if(!text||chatBusy[id])return;let q=text.toLowerCase();(conversations[id]||(conversations[id]=[])).push({role:'user',text});chatBusy[id]=true;render();setTimeout(()=>{let response;if(id!==0)response={text:'Ainda não tenho notas consultáveis para este sistema nesta demonstração. Posso mostrar as fontes cadastradas, mas não inferir arquitetura, regras ou comportamento a partir do nome de um repositório. Adicione as fontes; no produto, elas seriam processadas antes de fundamentar respostas.',refs:[]};else if(/senha|token|segredo|credencial/.test(q))response={text:'A fonte seleciona uma credencial de acesso ao GitHub. Tags organizam conteúdo; o consumidor externo usa um token destinado ao PetroVault. Não tenho acesso a tokens nesta demonstração. Você pode conferir a credencial selecionada na aba Fontes e o modelo de acesso na aba Acessos.',refs:[]};else if(/revis|alerta|notifica/.test(q))response={text:'A nota de alertas descreve prioridade, janela de avaliação e limites operacionais. A política de reenvio precisa de confirmação do responsável técnico. O status da nota está indicado abaixo; eu não devo apresentar esse ponto em aberto como uma regra confirmada.',refs:[2]};else if(/evento|ingest|worker/.test(q))response={text:'Na amostra, eventos chegam em lotes, passam por validação e normalização e seguem para processamento. Eventos inválidos vão para uma fila de revisão com o identificador da origem preservado. A evidência está no repositório observer-workers.',refs:[1]};else if(/autent|permiss|acesso|\bad\b/.test(q))response={text:'A nota descreve identidade corporativa AD e permissões associadas a grupos do diretório, verificadas antes da consulta ao conteúdo restrito. Isso representa o desenho do produto; a sessão atual não autentica no AD.',refs:[3]};else if(/arquitet|funciona|observer|componente/.test(q))response={text:'O Petro Observer reúne telemetria operacional, regras de alerta e uma interface de acompanhamento. A amostra organiza o contexto em API, interface web e workers de ingestão. Para conferir a descrição e seguir até o arquivo de origem, abra a nota de arquitetura.',refs:[0,1]};else response={text:'Não encontrei evidência suficiente nas quatro notas desta demonstração para responder a essa pergunta. Posso exemplificar respostas sobre arquitetura, ingestão, autenticação ou alertas. No produto, o agente consultaria apenas o conhecimento autorizado e citaria as fontes encontradas.',refs:[]};conversations[id].push({role:'assistant',...response});chatBusy[id]=false;if(state.page==='detail'&&state.system===id&&state.tab==='Agente'){render();document.getElementById('chat-log').scrollTop=document.getElementById('chat-log').scrollHeight}},700)}
document.addEventListener('click',e=>{let a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;let index=a.indexOf(':'),type=index<0?a:a.slice(0,index),arg=index<0?'':a.slice(index+1);if(type==='new-system')systemForm();if(type==='add-source')sourceForm();if(type==='source-detail')sourceDetail(+arg);if(type==='map-node'){graphSelected=arg;refreshMap()}if(type==='map-jump'){graphSelected=arg;graphFilter='Todos';render()}if(type==='map-filter'){graphFilter=arg;graphSelected='system';render()}if(type==='map-reset'){graphView={x:0,y:0,w:1000,h:430};refreshMap()}if(type==='zoom-in'||type==='zoom-out'){let factor=type==='zoom-in'?.8:1.25,newWidth=Math.min(1800,Math.max(400,graphView.w*factor)),newHeight=newWidth*.43;graphView.x+=(graphView.w-newWidth)/2;graphView.y+=(graphView.h-newHeight)/2;graphView.w=newWidth;graphView.h=newHeight;refreshMap()}if(type==='map-ask'){let node=mapData().nodes.find(n=>n.id===arg);state.tab='Agente';sendChat('O que sabemos sobre '+node.label+'?')}if(type==='ask')sendChat(arg);if(type==='clear-chat'){if(chatBusy[state.system]){toast('Aguarde a resposta antes de iniciar outra conversa.');return}conversations[state.system]=[];render()}});

function integrations(){lastIntegrationResponse='';return `<div class="heading"><div><div class="eyebrow">CONHECIMENTO ALÉM DO PETROVAULT</div><h2>Integrações</h2><p>Consulte o conhecimento deste sistema a partir de aplicações e agentes.</p></div><span class="badge warn">Proposta para revisão</span></div><div class="integration-intro"><div><span class="sysicon">${icon('book')}</span><h3>Uma base de conhecimento</h3><p>Notas curadas, verificação e proveniência.</p></div><span class="integration-arrow">→</span><div><span class="sysicon">${icon('shield')}</span><h3>Uma regra de acesso</h3><p>Identidade, sistema e conteúdo autorizado.</p></div><span class="integration-arrow">→</span><div><span class="sysicon">${icon('spark')}</span><h3>Duas formas de consumir</h3><p>API para aplicações. MCP para agentes.</p></div></div><div class="banner">${icon('help')}Contrato ilustrativo, somente leitura. Endereços não operacionais; o simulador não faz chamadas de rede.</div><div class="integration-selector"><button class="integration-choice ${integrationMode==='mcp'?'selected':''}" data-action="integration-mode:mcp" aria-pressed="${integrationMode==='mcp'}"><b>MCP</b><span>Agentes e assistentes compatíveis</span></button><button class="integration-choice ${integrationMode==='http'?'selected':''}" data-action="integration-mode:http" aria-pressed="${integrationMode==='http'}"><b>API HTTP</b><span>Aplicações, portais e automações</span></button></div><section class="panel"><div class="panel-head"><div><h2>${integrationMode==='mcp'?'Ferramenta · search_knowledge':'POST · /v1/knowledge/search'}</h2><small>${integrationMode==='mcp'?'Ferramenta descoberta pelo cliente via tools/list.':'JSON de consulta enviado pela aplicação consumidora.'}</small></div><div class="actions">${btn('Ver contrato','integration-contract','file')}${btn('Baixar exemplo','integration-download','arrow')}</div></div><div class="integration-endpoint"><small>ENDEREÇO ILUSTRATIVO</small><code>https://petrovault.example.invalid/${integrationMode==='mcp'?'mcp':'v1/knowledge/search'}</code><p>${integrationMode==='mcp'?'Proposta: MCP remoto via Streamable HTTP. O payload abaixo representa uma chamada após inicialização e negociação do protocolo; não é uma sessão completa. Referência de exemplo: MCP 2025-11-25, sem fixar a versão do produto.':'Proposta: API versionada, com Content-Type: application/json. O token seria enviado no cabeçalho Authorization: Bearer &lt;access_token&gt;, nunca no corpo da consulta.'}</p></div><div class="table-wrap"><table><thead><tr><th>CAMPO</th><th>FUNÇÃO</th><th>REGRA PROPOSTA</th></tr></thead><tbody><tr><td>system_id</td><td>Escopo da consulta</td><td>Obrigatório · ${systemKey()}</td></tr><tr><td>query</td><td>Texto pesquisado</td><td>1 a 500 caracteres</td></tr><tr><td>verification</td><td>Estado da nota</td><td>verified (padrão) ou all</td></tr><tr><td>limit</td><td>Máximo de resultados</td><td>1 a 20 · padrão 5</td></tr></tbody></table></div></section><section class="panel section-gap"><div class="panel-head"><div><h2>Experimente uma consulta</h2><small>Edite o JSON e simule a resposta com a amostra local.</small></div></div><div class="integration-lab"><form id="integration-form"><label for="integration-request">${integrationMode==='mcp'?'Payload JSON-RPC':'Corpo JSON da consulta'}</label><textarea id="integration-request" spellcheck="false" rows="15">${escapeHTML(JSON.stringify(exampleRequest(),null,2))}</textarea><div class="integration-controls"><label for="integration-scenario">Cenário demonstrativo</label><select id="integration-scenario"><option value="success">Consulta autorizada</option><option value="empty">Nenhum resultado</option><option value="denied">Acesso negado</option></select><button class="btn primary" type="submit">${icon('play')}Simular consulta</button></div><p class="muted" style="font-size:11px;margin-top:12px">No Petro Observer, experimente “arquitetura”, “eventos” ou “alertas”. “all” inclui notas em revisão; não amplia permissões.</p></form><div><div class="response-heading"><label>Resposta</label><button class="textbtn" data-action="integration-copy">Copiar resposta</button></div><div id="integration-status" class="muted" aria-live="polite">Aguardando uma consulta.</div><pre id="integration-response" tabindex="0">${escapeHTML('// A resposta aparecerá aqui.\n// Nenhum dado será enviado para fora deste navegador.')}</pre></div></div></section><div class="columns section-gap"><section class="panel"><div class="panel-head"><h2>Identidade e permissões</h2>${icon('shield')}</div><div class="overview-copy"><p>Proposta: OAuth para o acesso remoto, com identidade corporativa federada ao diretório da organização. O login AD da interface, sozinho, não autoriza um cliente externo.</p><div class="tags"><span class="tag">Escopo proposto: knowledge:read</span><span class="tag">Autorização por sistema</span></div><p style="margin-top:15px">O servidor valida identidade, audiência do token, escopo e acesso ao conteúdo em cada consulta. Informar um system_id não concede acesso. Notas, trechos e proveniência devem passar pela mesma regra.</p><p style="margin-top:15px">As credenciais de acesso ao GitHub servem apenas à ingestão. Esses segredos não são disponibilizados ao consumidor.</p></div></section><section class="panel"><div class="panel-head"><h2>O que disponibilizar primeiro</h2></div><div class="overview-copy"><p><b>Consulta a notas e trechos</b>, com status de verificação e arquivo/commit de origem. A resposta é conhecimento recuperado; o agente consumidor pode usá-lo para compor uma explicação.</p><p style="margin-top:15px">Evoluções a avaliar: leitura de uma nota completa por ID e consulta às relações do mapa. Cadastro, alterações e execução de código ficam fora desta proposta inicial.</p><p style="margin-top:15px">Busca sem resultado retorna lista vazia. Sem identidade válida: HTTP 401. Sem permissão: HTTP 403, sem trechos de conhecimento. O diagnóstico de autorização não deve revelar conteúdo restrito.</p></div></section></div><p class="integration-reference">Referências do exemplo: <a href="https://modelcontextprotocol.io/specification/2025-11-25/server/tools" target="_blank" rel="noopener">Ferramentas MCP</a> · <a href="https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization" target="_blank" rel="noopener">Autorização MCP</a>. Campos e endpoints PetroVault são propostas; a versão e a compatibilidade com clientes serão decididas depois.</p>`}

function simulateIntegration(){let req,args,id=1;try{req=JSON.parse(document.getElementById('integration-request').value)}catch{showIntegrationResponse('Validação local · JSON inválido',{error:{code:'INVALID_JSON',message:'Corrija a sintaxe do JSON e tente novamente.'}});return}let error='';if(integrationMode==='mcp'){if(req?.jsonrpc!=='2.0'||req.method!=='tools/call'||req.params?.name!=='search_knowledge'||!(typeof req.id==='string'||typeof req.id==='number'))error='Use jsonrpc 2.0, um id, tools/call e a ferramenta search_knowledge.';args=req?.params?.arguments;id=req?.id??1}else args=req;
if(!error&&(!args||typeof args!=='object'||Array.isArray(args)))error='Os argumentos devem ser um objeto JSON.';
if(!error&&Object.keys(args).some(k=>!['system_id','query','verification','limit'].includes(k)))error='Campo desconhecido. Use system_id, query, verification e limit.';
if(!error&&(typeof args.system_id!=='string'||typeof args.query!=='string'||!args.query.trim()||args.query.length>500))error='Informe system_id e uma query de 1 a 500 caracteres.';
if(!error&&args.verification!==undefined&&!['verified','all'].includes(args.verification))error='verification deve ser verified ou all.';
if(!error&&args.limit!==undefined&&(!Number.isInteger(args.limit)||args.limit<1||args.limit>20))error='limit deve ser um inteiro entre 1 e 20.';
if(error){showIntegrationResponse('Requisição inválida · simulação',integrationMode==='mcp'?{jsonrpc:'2.0',id,error:{code:-32602,message:error}}:{error:{code:'INVALID_REQUEST',message:error}});return}
let scenario=document.getElementById('integration-scenario').value;if(scenario==='denied'||args.system_id!==systemKey()){showIntegrationResponse('HTTP 403 · cenário simulado, sem conteúdo restrito',{error:{code:'FORBIDDEN',message:'Identidade sem permissão para consultar o sistema solicitado.'}});return}
let normalize=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),query=normalize(args.query).trim();let matches=state.system===0&&scenario!=='empty'?notes.map((n,i)=>({...n,i})).filter(n=>(args.verification==='all'||n.status==='Verificada')&&normalize(n.title+' '+n.desc+' '+n.type).includes(query)):[];let limit=args.limit??5;
let payload={system_id:args.system_id,results:matches.slice(0,limit).map(n=>({note_id:'observer-note-'+(n.i+1),title:n.title,excerpt:n.desc,verification:n.status==='Verificada'?'verified':'pending_review',updated_at:'2026-10-25T13:42:00Z',provenance:{repository:'petrovina/'+n.repo,path:n.file,branch:'main',commit:'8f3a2c1'}})),has_more:matches.length>limit,demo:true};showIntegrationResponse('HTTP 200 · '+payload.results.length+' resultado(s) de exemplo',integrationMode==='mcp'?{jsonrpc:'2.0',id,result:{content:[{type:'text',text:JSON.stringify(payload)}],structuredContent:payload,isError:false}}:payload)}

let authConsumer='person',authTokenState='valid';
function authGuide(){return `<section class="panel section-gap"><div class="panel-head"><div><h2>Como a requisição é autorizada</h2><small>Tags filtram conteúdo. O token identifica o consumidor; o servidor decide o acesso.</small></div>${btn('Quem pode consultar?','tab:Acessos','users')}</div><div class="overview-copy"><div class="integration-selector"><button class="integration-choice ${authConsumer==='person'?'selected':''}" data-action="auth-consumer:person" aria-pressed="${authConsumer==='person'}"><b>Pessoa usando um agente</b><span>Acesso delegado · identidade do usuário</span></button><button class="integration-choice ${authConsumer==='app'?'selected':''}" data-action="auth-consumer:app" aria-pressed="${authConsumer==='app'}"><b>Aplicação automática</b><span>Identidade própria · sem usuário presente</span></button></div><p>${authConsumer==='person'?'O cliente inicia o login no provedor corporativo via Authorization Code com PKCE. Após autenticação e consentimento aplicável, recebe um access token para o PetroVault. A consulta exige a permissão delegada e o acesso do usuário ao sistema e às notas.':'Um serviço registrado obtém um access token via Client Credentials, com certificado ou identidade federada, conforme o provedor. A permissão de aplicação é concedida por administrador; ela não herda as permissões de uma pessoa. Este fluxo é proposto para a API; suporte app-only em clientes MCP precisa ser validado.'}</p><div class="source" style="margin-top:16px"><small>CABEÇALHO DA REQUISIÇÃO · API E MCP REMOTO</small><pre class="contract-code">Authorization: Bearer &lt;access_token&gt;</pre><p style="margin-top:10px">O token vem do provedor de identidade, não de uma tag ou deste formulário. Não use o ID token nem o token do GitHub. Não cole credenciais reais neste protótipo.</p></div><div class="pipeline"><div class="stage"><span>${icon('users')}</span>Autenticar</div><i></i><div class="stage"><span>${icon('lock')}</span>Obter token</div><i></i><div class="stage"><span>${icon('shield')}</span>Validar e autorizar</div><i></i><div class="stage"><span>${icon('book')}</span>Filtrar conhecimento</div></div><p>O servidor verifica assinatura, emissor, audiência destinada ao PetroVault e expiração. Depois, verifica a permissão de leitura e as regras do sistema e de cada conteúdo. Tags só reduzem os resultados já autorizados.</p><div class="tags"><span class="tag">${authConsumer==='person'?'Permissão delegada proposta: knowledge:read':'Papel de aplicação proposto: Knowledge.Read'}</span><span class="tag">system_id não concede acesso</span></div><p style="margin-top:16px">O prazo de validade é definido pelo provedor. Quando necessário, o cliente obtém outro access token pelo fluxo suportado; aplicações sem usuário não dependem de refresh token. Nenhuma emissão ou validação criptográfica ocorre nesta demonstração.</p>${btn('Ver passos de conexão','auth-steps','arrow')}</div></section>`}
function authControls(){return `<div class="banner section-gap">${icon('help')}Identidade simulada: <b>${authConsumer==='person'?'Pessoa — Grupo de leitores':'Aplicação — Portal Operacional'}</b>. A permissão por sistema é configurada na aba Acessos.</div><label for="auth-token-state">Condição do token (simulação)</label><select id="auth-token-state" style="width:100%;margin-bottom:15px">${[['valid','Válido, com permissão de leitura'],['missing','Sem token'],['expired','Token expirado'],['audience','Token destinado a outro serviço'],['scope','Token sem permissão de leitura']].map(([v,t])=>`<option value="${v}" ${authTokenState===v?'selected':''}>${t}</option>`).join('')}</select>`}
const baseIntegrations=integrations;integrations=function(){let html=baseIntegrations();return html.replace('<div class="integration-selector">',authGuide()+'<div class="integration-selector">').replace('<label for="integration-request">',authControls()+'<label for="integration-request">')};
access=function(){let grants=accessForSystem();return `<div class="heading"><div><div class="eyebrow">AUTORIZAÇÃO DO SISTEMA</div><h2>Quem pode consultar ${systems[state.system].name}?</h2><p>Permissões para pessoas e aplicações. Ajustes abaixo são apenas uma simulação nesta sessão.</p></div>${btn('Ver requisição com token','tab:Integrações','arrow',true)}</div><div class="banner">${icon('shield')}Token válido + permissão de leitura + acesso ao sistema e ao conteúdo. Tags não substituem nenhuma dessas verificações.</div><section class="panel"><div class="panel-head"><h2>Consumidores de demonstração</h2><span class="badge neutral">Somente leitura externa</span></div><div class="table-wrap"><table><thead><tr><th>IDENTIDADE</th><th>PERMISSÃO NO TOKEN</th><th>ESTE SISTEMA</th><th>SIMULAÇÃO</th></tr></thead><tbody><tr><td>Grupo de leitores<small>Pessoa via identidade corporativa federada</small></td><td>knowledge:read<small>Delegada · usuário presente</small></td><td>${badge(grants.person?'Permitido':'Sem acesso')}</td><td>${btn(grants.person?'Remover acesso simulado':'Permitir consulta simulada','auth-toggle:person')}</td></tr><tr><td>Portal Operacional<small>Identidade própria da aplicação · exemplo</small></td><td>Knowledge.Read<small>Papel de aplicação · sem usuário</small></td><td>${badge(grants.app?'Permitido':'Sem acesso')}</td><td>${btn(grants.app?'Remover acesso simulado':'Permitir consulta simulada','auth-toggle:app')}</td></tr></tbody></table></div></section><div class="columns section-gap"><section class="panel"><div class="panel-head"><h2>Três conceitos separados</h2></div><div class="overview-copy"><h3>Tags de organização</h3><p>Ex.: operação e documentação. Classificam e filtram conteúdo autorizado.</p><h3 style="margin-top:18px">Credencial de acesso à fonte</h3><p>Permite ao PetroVault ler o GitHub. É selecionada na fonte e seu segredo fica protegido no servidor.</p><h3 style="margin-top:18px">Token de acesso ao PetroVault</h3><p>É apresentado pelo consumidor da API ou do MCP. Destinado ao PetroVault, com validade e permissões próprias.</p></div></section><section class="panel"><div class="panel-head"><h2>Como aplicar as regras</h2></div><div class="overview-copy"><p>No produto, administradores associariam grupos corporativos e identidades de aplicações aos sistemas. Restrições das fontes e das notas também precisam ser preservadas.</p><p style="margin-top:15px">Esta amostra aplica uma regra única às quatro notas demonstrativas do Observer. Notas reais com fontes restritas só poderiam ser retornadas quando o solicitante tiver autorização para o conteúdo correspondente.</p><p style="margin-top:15px">Trocar system_id, pedir verification=all ou mudar uma tag não amplia acesso. Alterações reais de permissão exigiriam perfil administrativo e registro de auditoria.</p></div></section></div>`};
const originalSimulation=simulateIntegration;simulateIntegration=function(){authTokenState=document.getElementById('auth-token-state')?.value||'valid';if(['missing','expired','audience'].includes(authTokenState)){showIntegrationResponse('HTTP 401 · autenticação recusada (simulação)',{error:{code:authTokenState==='missing'?'TOKEN_REQUIRED':'INVALID_TOKEN',message:{missing:'Apresente um access token destinado ao PetroVault.',expired:'Token expirado. Obtenha um novo access token.',audience:'Este token não é destinado ao PetroVault.'}[authTokenState]},demo:true});return}if(authTokenState==='scope'||!accessForSystem()[authConsumer]){showIntegrationResponse('HTTP 403 · consulta não autorizada (simulação)',{error:{code:'FORBIDDEN',message:authTokenState==='scope'?'O token não possui a permissão de leitura exigida.':'A identidade não possui acesso a este sistema.'},demo:true});return}originalSimulation()};
document.addEventListener('change',e=>{if(e.target.id==='auth-token-state')authTokenState=e.target.value});
document.addEventListener('click',e=>{let action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action.startsWith('auth-consumer:')){authConsumer=action.split(':')[1];render()}if(action.startsWith('auth-toggle:')){let who=action.split(':')[1],grants=accessForSystem();grants[who]=!grants[who];render();toast('Permissão demonstrativa atualizada apenas nesta sessão.')}if(action==='auth-steps')modal(`<h2>${authConsumer==='person'?'Conectar um agente em nome de uma pessoa':'Conectar uma aplicação automática'}</h2><p>Proposta de conexão, sem configuração real neste protótipo.</p>${authConsumer==='person'?'<ol><li>Registrar ou autorizar o cliente junto ao provedor corporativo.</li><li>Iniciar login com Authorization Code + PKCE e consentimento aplicável.</li><li>Receber access token destinado ao PetroVault, com permissão delegada.</li><li>Enviar o token no cabeçalho Authorization.</li><li>O PetroVault verifica também o acesso do usuário ao sistema e às notas.</li></ol>':'<ol><li>Registrar uma identidade de aplicação no provedor.</li><li>Conceder administrativamente o papel de leitura e o acesso aos sistemas necessários.</li><li>Configurar certificado ou identidade federada no serviço consumidor, conforme suporte.</li><li>Obter access token via Client Credentials e enviá-lo em Authorization.</li><li>Renovar a obtenção do token conforme sua validade. O consumidor não recebe o segredo do GitHub.</li></ol>'}<div class="source">AD local pode exigir uma camada federada de identidade. Provedor, registro de clientes e suporte MCP serão definidos na integração real.</div><p><a href="https://learn.microsoft.com/en-us/entra/identity-platform/${authConsumer==='person'?'v2-oauth2-auth-code-flow':'v2-oauth2-client-creds-grant-flow'}" target="_blank" rel="noopener">Referência Microsoft para o fluxo proposto</a></p>`)});

// Review-focused interface: actions first; explanations on demand.
function helpTip(text){return `<span class="help-tip" tabindex="0" role="note" aria-label="${escapeHTML(text)}">?<span>${escapeHTML(text)}</span></span>`}
function sourceForm(){modal(`<h2>Adicionar repositório</h2><form id="source-form"><label for="src-url">Repositório GitHub</label><input id="src-url" name="url" type="url" required placeholder="https://github.com/organizacao/repositorio"><label for="src-branch">Branch</label><input id="src-branch" name="branch" required maxlength="80" value="main"><label for="demo-pat">PAT do GitHub ${helpTip('Na versão real, você informaria um Personal Access Token autorizado a ler este repositório. Ele seria usado pelo PetroVault para a curadoria.')}</label><input id="demo-pat" type="password" value="PAT-DEMO-NAO-VALIDO" readonly aria-label="PAT fictício de demonstração"><input type="hidden" name="credential" value="github-engineering"><small>Token fictício. Não insira credenciais reais neste protótipo.</small><div class="actions section-gap">${btn('Testar acesso','test-pat','shield')}<span id="pat-result" role="status" class="muted"></span></div><p class="form-error" role="alert" id="form-error"></p><div class="modal-actions"><button type="button" class="btn" data-action="close">Cancelar</button><button class="btn primary" type="submit">Adicionar repositório</button></div></form>`);document.getElementById('src-url').focus()}
sources=function(){let list=sourceSets[state.system]||[];return `<div class="heading"><div><h2>Repositórios ${helpTip('O PetroVault usa o PAT cadastrado em cada fonte para ler o repositório e produzir conhecimento.')}</h2></div><div class="actions">${list.length?btn('Processar fontes','sync','play'):''}${btn('Adicionar repositório','add-source','plus',true)}</div></div><section class="panel">${list.length?list.map((r,i)=>`<div class="repo"><span class="sysicon">${icon('git')}</span><div class="repo-info"><h3>${r.name}</h3><small>${r.branch} · ${r.count} notas</small></div>${badge(r.status)}${btn('Configurar',`source-detail:${i}`)}</div>`).join(''):`<div class="empty"><h2>Adicione a primeira fonte.</h2><p>Um repositório e seu PAT do GitHub.</p>${btn('Adicionar repositório','add-source','plus',true)}</div>`}</section>`};
sourceDetail=function(i){let r=sourceSets[state.system][i];modal(`<h2>${r.name}</h2><div class="switchrow"><span>Branch</span><b>${r.branch}</b></div><div class="switchrow"><span>PAT do GitHub ${helpTip('Permite ler esta fonte. Não serve para consultar a API do PetroVault.')}</span><span>••••••••</span></div><div class="switchrow"><span>Estado</span>${badge(r.status)}</div><div class="actions section-gap">${btn('Testar acesso','test-pat','shield')}${btn('Atualizar PAT de demonstração','refresh-pat','refresh')}</div><p id="pat-result" role="status"></p><small>Credencial fictícia, sem conexão com GitHub.</small>`)};
const integrationTokens={};
integrations=function(){let token=integrationTokens[state.system];lastIntegrationResponse='';return `<div class="heading"><div><h2>Integrações ${helpTip('Permite que ferramentas externas consultem o conhecimento deste sistema usando um token do PetroVault. Não expõe o PAT do GitHub.')}</h2></div><span class="badge neutral">Somente leitura</span></div><section class="panel"><div class="panel-head"><h2>Acesso externo</h2>${badge(token?.active?'Token demonstrativo ativo':'Não configurado')}</div><div class="overview-copy"><div class="switchrow"><span>Sistema</span><b>${systems[state.system].name}</b></div><div class="switchrow"><span>Permissão ${helpTip('Este token consulta apenas o conhecimento deste sistema. Não permite editar fontes nem executar código.')}</span><b>Consultar conhecimento</b></div>${token?.active?`<div class="switchrow"><span>Token PetroVault</span><code>pv_demo_••••••••</code></div><div class="actions section-gap">${btn('Ver token de demonstração','show-system-token','lock')}${btn('Revogar','revoke-system-token')}</div>`:`<p style="margin:18px 0">Crie um token para conectar uma ferramenta.</p>${btn('Criar token de demonstração','create-system-token','plus',true)}`}</div></section><details class="quiet-details section-gap"><summary>Como usar em outra ferramenta</summary><div class="quiet-content"><p>Configure o endereço do PetroVault e envie o token no cabeçalho da requisição. MCP e API usam o mesmo limite de acesso ao sistema.</p><pre class="contract-code">Authorization: Bearer &lt;token_do_petrovault&gt;</pre><small>Proposta de token próprio do PetroVault. A compatibilidade de autenticação depende do cliente MCP escolhido.</small></div></details><details class="quiet-details section-gap"><summary>Documentação técnica e teste de consulta</summary><div class="quiet-content"><div class="actions">${btn('MCP','integration-mode:mcp')}${btn('API HTTP','integration-mode:http')}${btn('Ver contrato','integration-contract','file')}${btn('Baixar exemplo','integration-download','arrow')}</div><p style="margin:16px 0"><code>https://petrovault.example.invalid/${integrationMode==='mcp'?'mcp':'v1/knowledge/search'}</code></p><small>Endereço fictício · ${integrationMode==='mcp'?'Chamada MCP após inicialização. Referência: 2025-11-25.':'Consulta HTTP POST.'}</small><div class="integration-lab section-gap"><form id="integration-form"><label for="integration-request">Consulta</label><textarea id="integration-request" rows="13">${escapeHTML(JSON.stringify(exampleRequest(),null,2))}</textarea><label for="integration-scenario">Cenário de teste</label><select id="integration-scenario"><option value="success">Consulta normal</option><option value="empty">Sem resultados</option><option value="denied">Acesso negado</option></select><button type="submit" class="btn primary">Simular consulta</button></form><div><label>Resposta</label><div id="integration-status" aria-live="polite"></div><pre id="integration-response">Aguardando consulta.</pre><button class="textbtn" data-action="integration-copy">Copiar resposta</button></div></div></div></details>`};
simulateIntegration=function(){if(!integrationTokens[state.system]?.active){showIntegrationResponse('HTTP 401 · demonstração',{error:{code:'TOKEN_REQUIRED',message:'Crie um token de demonstração para testar a consulta.'},demo:true});return}originalSimulation()};
document.addEventListener('click',e=>{let action=e.target.closest('[data-action]')?.dataset.action;if(action?.startsWith('integration-mode:')){document.querySelectorAll('.quiet-details')[1]?.setAttribute('open','')}if(action==='test-pat'){let input=document.getElementById('src-url');if(input&&!/^https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/?$/.test(input.value)){document.getElementById('pat-result').textContent='Informe uma URL de repositório GitHub.';return}document.getElementById('pat-result').textContent='Acesso de leitura aprovado — simulação.'}if(action==='refresh-pat'){document.getElementById('pat-result').textContent='PAT fictício atualizado. Nenhum segredo real foi alterado.'}if(action==='create-system-token'){integrationTokens[state.system]={active:true};render();toast('Token fictício criado para este sistema.')}if(action==='revoke-system-token'){integrationTokens[state.system]={active:false};render();toast('Acesso demonstrativo revogado.')}if(action==='show-system-token')modal(`<h2>Token de demonstração</h2><pre class="contract-code">pv_demo_${systemKey()}_NAO_VALIDO</pre><p>Exemplo fictício, sem validade fora deste protótipo. No produto, o segredo seria exibido apenas no momento da criação.</p>`)});

function entryScreen(){return entryLayout(`<div class="entry-grid"><section class="entry-story"><div class="eyebrow">CONHECIMENTO QUE PERMANECE</div><h1>Seus sistemas.<br>Seu conhecimento.<br><span>Um só lugar.</span></h1><p>Transforme código e documentação em respostas com contexto e origem.</p><div class="entry-flow"><span>${icon('git')}Fontes</span><i></i><span>${icon('book')}Conhecimento</span><i></i><span>${icon('spark')}Respostas</span></div></section><section class="entry-card"><span class="sysicon">${icon('shield')}</span><h2>Bem-vindo ao PetroVault.</h2><p>Use sua conta Microsoft corporativa.</p><button class="btn primary entry-login" data-action="corporate-login" ${entryBusy?'disabled':''}>${entryBusy?icon('refresh'):'<span class="microsoft-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>'}${entryBusy?'Entrando…':'Entrar com a Microsoft'}</button>${entryError?'<div class="banner warn" role="alert">Não foi possível entrar. Tente novamente.</div>':''}<small>Login demonstrativo. Nenhuma senha será solicitada.</small><details class="entry-help"><summary>Precisa de ajuda?</summary><p>No produto, a entrada será feita pelo provedor corporativo. Se sua conta não tiver acesso, procure o administrador da plataforma.</p><button class="textbtn" data-action="entry-error">Simular falha de entrada</button></details></section></div>`)}
function welcomeScreen(){let cards=[{eye:'01 / CONECTE O CONTEXTO',title:'Comece pelo seu sistema.',desc:'Cadastre o sistema e adicione seus repositórios com um PAT do GitHub.',ico:'git',labels:['Sistema','Repositórios','PAT do GitHub']},{eye:'02 / CONSTRUA O CONHECIMENTO',title:'O código ganha contexto.',desc:'A curadoria organiza notas e conecta suas origens no mapa de conhecimento.',ico:'book',labels:['Fontes','Curadoria','Notas e mapa']},{eye:'03 / ENCONTRE RESPOSTAS',title:'Pergunte. Entenda. Compartilhe.',desc:'Converse com o agente ou conecte suas ferramentas usando um token do PetroVault.',ico:'spark',labels:['Conhecimento','Agente','Integrações']}],c=cards[welcomeStep];return entryLayout(`<section class="welcome-card page" aria-label="Apresentação inicial"><div class="welcome-top"><span class="muted">Uma introdução rápida</span><button class="textbtn" data-action="welcome-skip">Pular apresentação</button></div><div class="welcome-content"><div class="welcome-symbol">${icon(c.ico)}</div><div class="eyebrow">${c.eye}</div><h1>${c.title}</h1><p>${c.desc}</p><div class="welcome-steps">${c.labels.map((s,i)=>`${i?'<span aria-hidden="true">→</span>':''}<b>${s}</b>`).join('')}</div></div><div class="welcome-bottom"><div class="welcome-dots" aria-label="Etapa ${welcomeStep+1} de 3">${cards.map((_,i)=>`<button aria-label="Ir para etapa ${i+1}" aria-current="${welcomeStep===i?'step':'false'}" class="${welcomeStep===i?'active':''}" data-action="welcome-step:${i}"></button>`).join('')}</div><div class="actions">${welcomeStep?btn('Voltar','welcome-back'):''}${btn(welcomeStep===2?'Explorar PetroVault':'Continuar',welcomeStep===2?'welcome-finish':'welcome-next','arrow',true)}</div></div></section>`)}
const renderWorkspace=render;render=function(){document.body.classList.toggle('dark',state.dark);document.body.classList.toggle('entry-mode',state.signedout||welcomeVisible);if(state.signedout||welcomeVisible){document.getElementById('app').innerHTML=state.signedout?entryScreen():welcomeScreen();return}renderWorkspace();let menu=document.querySelector('.profilemenu');if(menu){let replay=document.createElement('button');replay.dataset.action='welcome-replay';replay.textContent='Rever apresentação';menu.appendChild(replay)}};
document.addEventListener('click',e=>{let a=e.target.closest('[data-action]')?.dataset.action;if(a==='corporate-login'&&!entryBusy){entryBusy=true;entryError=false;render();setTimeout(()=>{entryBusy=false;state.signedout=false;welcomeVisible=!welcomeSeen();welcomeStep=0;render()},650)}if(a==='entry-error'){entryError=true;render()}if(a==='welcome-next')transitionWelcome(welcomeStep+1);if(a==='welcome-back')transitionWelcome(welcomeStep-1);if(a?.startsWith('welcome-step:'))transitionWelcome(Number(a.split(':')[1]));if(a==='welcome-skip'||a==='welcome-finish')finishWelcome();if(a==='welcome-replay'){welcomeVisible=true;welcomeStep=0;state.profile=false;render()}});
state.signedout=true;

let welcomeChanging=false;
async function transitionWelcome(next){
  next=Math.max(0,Math.min(2,next));
  if(welcomeChanging||next===welcomeStep)return;
  const card=document.querySelector('.welcome-card');
  if(!card||!welcomeVisible)return;
  const content=card.querySelector('.welcome-content');
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const direction=next>welcomeStep?1:-1;
  const focused=document.activeElement?.dataset.action;
  welcomeChanging=true;
  try{
    if(content&&!reduced)await content.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:`translateY(${-direction*7}px)`}],{duration:160,easing:'ease-in',fill:'forwards'}).finished;
    if(!welcomeVisible||document.querySelector('.welcome-card')!==card)return;
    welcomeStep=next;
    const fragment=document.createElement('div');fragment.innerHTML=welcomeScreen();
    card.innerHTML=fragment.querySelector('.welcome-card').innerHTML;
    const incoming=card.querySelector('.welcome-content');
    if(incoming&&!reduced)incoming.animate([{opacity:0,transform:`translateY(${direction*12}px)`},{opacity:1,transform:'translateY(0)'}],{duration:430,easing:'cubic-bezier(.16,1,.3,1)'});
    if(focused){const target=Array.from(card.querySelectorAll('button')).find(b=>b.dataset.action===focused)||card.querySelector('[data-action="welcome-finish"]')||card.querySelector('[data-action="welcome-next"]');target?.focus({preventScroll:true})}
  }finally{welcomeChanging=false}
}

render();
</script></body></html>
